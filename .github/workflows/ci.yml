name: ci

on:
  push:
  pull_request:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript 状态机与协议
        run: node --test
      - name: 固件逻辑与界面（主机）
        run: make -C firmware/host test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 只编译，不烧录
        run: docker run --rm -v "${PWD}:/work" -w /work espressif/idf:v5.5 idf.py -C firmware build
