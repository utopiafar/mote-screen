<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480">
  <title>墨水屏预览 · 主桌面</title>
  <link rel="stylesheet" href="eink.css">
</head>
<body class="panel">
  <header class="topbar">
    <div class="brand" id="brand">主桌面</div>
    <div class="clock num" id="clock">11:57</div>
  </header>

  <section class="view on" id="view-home">
    <div class="desk" id="desk"></div>
  </section>

  <section class="view" id="view-overview">
    <div class="overview">
      <button type="button" class="half speed" id="half-speed">
        <div>
          <div class="ov-label"><span>速度</span><span class="go">按下查看详情</span></div>
          <div class="ov-tok num" id="ov-tok">75.9<span class="unit">tok/s</span></div>
          <div class="ov-phase" id="ov-phase">生成中 · 3 个会话在跑</div>
        </div>
        <svg class="spark-sm" id="spark-sm" viewBox="0 0 436 56" preserveAspectRatio="none" aria-label="近一分钟速度"></svg>
      </button>
      <div class="half inbox" id="half-inbox">
        <div class="ov-label"><span>CODEX 待处理</span><span class="go" id="ov-inbox-go">按下查看全部</span></div>
        <div class="ov-cards" id="ov-cards"></div>
        <div class="empty" id="ov-empty" hidden>
          <h1>一切安静</h1>
          <p>没有等待批准的 Codex 对话。</p>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-speed">
    <div class="speed-hero">
      <div class="label">AGENT SPEED · 本机输出</div>
      <div class="value num" id="tok">75.9<span class="unit">tok/s</span></div>
      <div class="phase" id="phase">生成中</div>
    </div>
    <div class="counts">
      <div class="count"><div class="n num" id="c-active">3</div><div class="l">进行中</div></div>
      <div class="count"><div class="n num" id="c-gen">2</div><div class="l">正在生成</div></div>
      <div class="count"><div class="n num" id="c-tools">1</div><div class="l">调用工具</div></div>
    </div>
    <div class="chart-wrap">
      <div class="label">近一分钟</div>
      <svg class="spark" id="spark" viewBox="0 0 432 88" preserveAspectRatio="none" aria-label="近一分钟速度曲线"></svg>
    </div>
    <div class="sources" id="sources"></div>
  </section>

  <section class="view" id="view-inbox">
    <div class="inbox-head">
      <h1>Codex 待处理</h1>
      <div class="count-label num" id="inbox-count">2 条在等批准</div>
    </div>
    <div class="list" id="inbox-list"></div>
    <div class="empty" id="inbox-empty" hidden>
      <h1>一切安静</h1>
      <p>没有等待批准或刚结束的 Codex 对话。</p>
    </div>
  </section>

  <section class="view" id="view-clock">
    <div class="clock-hero">
      <div class="big num" id="clock-big">11:57</div>
      <div class="date">星期一 11 月 16 日</div>
    </div>
  </section>

  <section class="view" id="view-settings">
    <div class="stack">
      <div class="rowline"><span class="k">墨水屏</span><span class="v">预览中 · 未刷机</span></div>
      <div class="rowline"><span class="k">Agent Speed</span><span class="v">局域网 · 7247</span></div>
      <div class="rowline"><span class="k">Codex hook</span><span class="v">待接入</span></div>
      <div class="rowline"><span class="k">刷新</span><span class="v">速度节流 · 通知立即推</span></div>
    </div>
  </section>

  <section class="view" id="view-reserved">
    <div class="reserved-msg">
      <h1>这一格留给以后</h1>
      <p>主桌面可以再放别的应用。这一期只做工作台。</p>
    </div>
  </section>

  <footer class="foot">
    <span id="foot-left">上 / 下选择</span>
    <span id="foot-right">按下打开 · BOOT 返回</span>
  </footer>

  <script>
    const PHASES = { generating: "生成中", tools: "调用工具", idle: "空闲" };
    const APPS = [
      { id: "workbench", kicker: "APP", name: "工作台" },
      { id: "clock", kicker: "APP", name: "时钟" },
      { id: "settings", kicker: "APP", name: "设置" },
      { id: "reserved", kicker: "空", name: "预留", reserved: true }
    ];

    const state = {
      view: "home",
      homeSel: 0,
      ovSel: 0, // 0 = speed half, 1+ = overview cards
      inboxSel: 0,
      clock: "11:57",
      speed: {
        outputTokS: 75.9,
        phase: "generating",
        active: 3,
        generating: 2,
        tools: 1,
        curve: [12, 18, 22, 41, 55, 63, 70, 68, 74, 80, 77, 69, 58, 61, 73, 81, 79, 76, 78, 75.9],
        sources: [
          { name: "Codex", tok: 48.2 },
          { name: "Claude Code", tok: 27.7 },
          { name: "OpenCode", tok: 0 }
        ]
      },
      items: [
        { id: 1, kind: "permission", title: "允许运行 cargo test", meta: "codex · payments-api", wait: "已等 1 分 20 秒" },
        { id: 2, kind: "permission", title: "允许修改 src/main.rs", meta: "codex · eink-sidecar", wait: "已等 36 秒" },
        { id: 3, kind: "stop", title: "本轮已结束", meta: "codex · notes-cli", wait: "2 分钟前" }
      ]
    };

    const $ = (id) => document.getElementById(id);
    function pending() { return state.items.filter((x) => x.kind === "permission"); }
    function tokText() { return state.speed.phase === "idle" ? "0" : state.speed.outputTokS.toFixed(1); }

    function sparkPath(pts, w, h, pad) {
      const max = Math.max(1, ...pts);
      const step = (w - pad * 2) / Math.max(1, pts.length - 1);
      const xy = pts.map((v, i) => [pad + i * step, h - pad - (v / max) * (h - pad * 2)]);
      const d = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const area = d + " L " + xy[xy.length - 1][0].toFixed(1) + " " + (h - 2) + " L " + xy[0][0].toFixed(1) + " " + (h - 2) + " Z";
      return { d, area };
    }
    function drawSparks() {
      const a = sparkPath(state.speed.curve, 432, 88, 8);
      $("spark").innerHTML = '<rect width="432" height="88" fill="#fff"/><path d="' + a.area + '" fill="#c8c8c8"/><path d="' + a.d + '" fill="none" stroke="#111" stroke-width="3"/>';
      const b = sparkPath(state.speed.curve, 436, 56, 4);
      $("spark-sm").innerHTML = '<path d="' + b.area + '" fill="#c8c8c8"/><path d="' + b.d + '" fill="none" stroke="#111" stroke-width="3"/>';
    }

    function cardHtml(it, sel, compact) {
      const urgent = it.kind === "permission";
      const tag = urgent ? "等待批准" : "已结束";
      return '<article class="card' + (urgent ? " urgent" : "") + (sel ? " sel" : "") + '">' +
        '<div><span class="tag">' + tag + '</span></div>' +
        '<div class="title">' + it.title + '</div>' +
        '<div class="meta">' + it.meta + '</div>' +
        (compact ? "" : '<div class="wait">' + it.wait + "</div>") +
        "</article>";
    }

    function renderHome() {
      const waits = pending().length;
      const status = tokText() + " tok/s · " + (waits ? waits + " 条待处理" : "一切安静");
      $("desk").innerHTML = APPS.map((app, i) => {
        const sel = i === state.homeSel ? " sel" : "";
        const res = app.reserved ? " reserved" : "";
        const badge = app.id === "workbench" && waits ? '<span class="badge">' + waits + "</span>" : "";
        const st = app.id === "workbench" ? status : (app.reserved ? "尚未开放" : "");
        return '<button type="button" class="cell' + sel + res + '" data-i="' + i + '">' +
          '<div><div class="kicker">' + app.kicker + '</div><div class="name">' + app.name + badge + "</div></div>" +
          (st ? '<div class="cell-status">' + st + "</div>" : "<div></div>") +
          "</button>";
      }).join("");
      $("desk").querySelectorAll(".cell").forEach((el) => {
        el.addEventListener("click", () => {
          const i = Number(el.getAttribute("data-i"));
          if (state.homeSel === i) press();
          else { state.homeSel = i; renderHome(); }
        });
      });
    }

    function renderSpeed() {
      const s = state.speed;
      const tok = tokText();
      $("tok").innerHTML = tok + '<span class="unit">tok/s</span>';
      $("phase").textContent = PHASES[s.phase] || s.phase;
      $("c-active").textContent = s.active;
      $("c-gen").textContent = s.generating;
      $("c-tools").textContent = s.tools;
      $("sources").innerHTML = s.sources.map((src) => {
        const n = s.phase === "idle" ? "0.0" : src.tok.toFixed(1);
        return '<div class="src"><span>' + src.name + '</span><span class="n num">' + n + " tok/s</span></div>";
      }).join("");
      $("ov-tok").innerHTML = tok + '<span class="unit">tok/s</span>';
      $("ov-phase").textContent = (PHASES[s.phase] || "") + " · " + s.active + " 个会话在跑";
      $("clock-big").textContent = state.clock;
      drawSparks();
    }

    function renderInbox() {
      const waits = pending();
      $("inbox-count").textContent = waits.length ? waits.length + " 条在等批准" : "暂无等待";
      const list = $("inbox-list");
      const empty = $("inbox-empty");
      if (!state.items.length) {
        list.innerHTML = "";
        empty.hidden = false;
      } else {
        empty.hidden = true;
        if (state.inboxSel >= state.items.length) state.inboxSel = Math.max(0, state.items.length - 1);
        list.innerHTML = state.items.map((it, i) => cardHtml(it, i === state.inboxSel, false)).join("");
      }

      const ovCards = $("ov-cards");
      const ovEmpty = $("ov-empty");
      const preview = waits.slice(0, 2);
      if (!preview.length) {
        ovCards.innerHTML = "";
        ovEmpty.hidden = false;
        $("ov-inbox-go").textContent = "";
      } else {
        ovEmpty.hidden = true;
        $("ov-inbox-go").textContent = "按下查看全部";
        ovCards.innerHTML = preview.map((it, i) => cardHtml(it, state.ovSel === i + 1, true)).join("");
      }

      $("half-speed").classList.toggle("sel", state.view === "overview" && state.ovSel === 0);
    }

    const TITLES = {
      home: "主桌面", overview: "工作台", speed: "速度",
      inbox: "Codex 待处理", clock: "时钟", settings: "设置", reserved: "预留"
    };

    function showView(name) {
      state.view = name;
      document.querySelectorAll(".view").forEach((el) => el.classList.toggle("on", el.id === "view-" + name));
      $("brand").textContent = TITLES[name] || name;
      $("clock").textContent = state.clock;
      const feet = {
        home: ["上 / 下选择", "按下打开"],
        overview: ["上 / 下选择", "按下进入详情 · BOOT 回桌面"],
        speed: ["速度来自 Agent Speed", "BOOT 返回工作台"],
        inbox: [state.items.length ? "上 / 下浏览" : "暂无条目", "BOOT 返回工作台"],
        clock: ["", "BOOT 回桌面"],
        settings: ["与 Mac 的连接状态", "BOOT 回桌面"],
        reserved: ["这一期只做工作台", "BOOT 回桌面"]
      };
      const f = feet[name] || ["", "BOOT 返回"];
      $("foot-left").textContent = f[0];
      $("foot-right").textContent = f[1];
    }

    function render() {
      $("clock").textContent = state.clock;
      renderSpeed();
      renderInbox();
      renderHome();
      showView(state.view);
      if (state.view === "overview") $("half-speed").classList.toggle("sel", state.ovSel === 0);
    }

    function ovMax() {
      const n = Math.min(2, pending().length);
      return n === 0 ? 0 : n; // 0 is speed; 1..n are cards
    }

    function wheel(dir) {
      if (state.view === "home") {
        state.homeSel = (state.homeSel + (dir > 0 ? 1 : 3)) % 4;
        renderHome();
      } else if (state.view === "overview") {
        const max = ovMax();
        state.ovSel = Math.max(0, Math.min(max, state.ovSel + dir));
        renderInbox();
        $("half-speed").classList.toggle("sel", state.ovSel === 0);
      } else if (state.view === "inbox" && state.items.length) {
        state.inboxSel = Math.max(0, Math.min(state.items.length - 1, state.inboxSel + dir));
        renderInbox();
      }
    }

    function press() {
      if (state.view === "home") {
        const app = APPS[state.homeSel];
        if (app.id === "workbench") { state.ovSel = pending().length ? 1 : 0; showView("overview"); renderInbox(); $("half-speed").classList.toggle("sel", state.ovSel === 0); }
        else showView(app.id);
      } else if (state.view === "overview") {
        if (state.ovSel === 0) showView("speed");
        else { state.inboxSel = state.ovSel - 1; showView("inbox"); renderInbox(); }
      }
    }

    function boot() {
      if (state.view === "speed" || state.view === "inbox") {
        showView("overview");
        renderInbox();
        $("half-speed").classList.toggle("sel", state.ovSel === 0);
      } else if (state.view !== "home") {
        if (state.view === "overview") state.homeSel = 0;
        showView("home");
        renderHome();
      }
    }

    let nextId = 10;
    function inject(kind) {
      if (kind === "permission") {
        nextId += 1;
        state.items.unshift({ id: nextId, kind: "permission", title: "允许运行 git push", meta: "codex · website", wait: "刚到达" });
        state.inboxSel = 0;
        state.ovSel = 1;
        if (state.view === "home") state.homeSel = 0;
      } else if (kind === "stop") {
        nextId += 1;
        state.items.push({ id: nextId, kind: "stop", title: "本轮已结束", meta: "codex · website", wait: "刚刚" });
      } else if (kind === "idle") {
        state.speed.phase = "idle";
        state.speed.active = 0;
        state.speed.generating = 0;
        state.speed.tools = 0;
      } else if (kind === "generating") {
        state.speed.phase = "generating";
        state.speed.outputTokS = 75.9;
        state.speed.active = 3;
        state.speed.generating = 2;
        state.speed.tools = 1;
      } else if (kind === "clear") {
        state.items = [];
        state.inboxSel = 0;
        state.ovSel = 0;
      }
      render();
    }

    function applyQuery() {
      const q = new URLSearchParams(location.search);
      if (q.get("clock")) state.clock = q.get("clock");
      if (q.get("pending") === "0") state.items = [];
      if (q.get("phase") === "idle") {
        state.speed.phase = "idle";
        state.speed.active = 0;
        state.speed.generating = 0;
        state.speed.tools = 0;
      }
      const screen = q.get("screen");
      const map = { home: "home", overview: "overview", speed: "speed", inbox: "inbox", clock: "clock", settings: "settings", reserved: "reserved" };
      if (map[screen]) state.view = map[screen];
      if (screen === "overview" && pending().length) state.ovSel = 1;
      if (screen === "workbench") state.view = "overview";
    }

    $("half-speed").addEventListener("click", () => {
      if (state.view !== "overview") return;
      if (state.ovSel === 0) press();
      else { state.ovSel = 0; render(); }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); wheel(-1); }
      else if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); wheel(1); }
      else if (e.key === "Enter") { e.preventDefault(); press(); }
      else if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); boot(); }
    });
    window.addEventListener("message", (e) => {
      const d = e.data || {};
      if (d.action === "wheel-up") wheel(-1);
      if (d.action === "wheel-down") wheel(1);
      if (d.action === "press") press();
      if (d.action === "boot") boot();
      if (d.action === "inject") inject(d.kind);
    });
    window.eink = { wheel, press, boot, inject, render, state };
    applyQuery();
    render();
  </script>
</body>
</html>
