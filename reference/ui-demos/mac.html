<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mac 客户端 · 连接状态</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
      background: #4e555c;
      color: #1c1c1e;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    .desktop {
      width: 1280px;
      height: 800px;
      margin: 0 auto;
      position: relative;
      background:
        radial-gradient(900px 520px at 78% 12%, rgba(170, 176, 168, .45), transparent 60%),
        radial-gradient(800px 480px at 8% 88%, rgba(62, 58, 54, .55), transparent 55%),
        linear-gradient(180deg, #6a7178 0%, #4e555c 48%, #3f444a 100%);
    }
    .menubar {
      height: 25px;
      background: rgba(245, 246, 247, .62);
      border-bottom: 1px solid rgba(0,0,0,.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 10px;
      font-size: 13px;
      letter-spacing: -.01em;
      position: relative;
      z-index: 20;
    }
    .mb-left, .mb-right { display: flex; align-items: center; gap: 14px; }
    .mb-item { opacity: .9; }
    .mb-item.bold { font-weight: 600; }
    .our {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .pip {
      width: 6px; height: 6px; border-radius: 50%;
      background: #b0b0b4;
      flex: none;
    }
    .pip.ok { background: #1c1c1e; }
    .pip.warn { background: #8e8e93; }
    .pip.err { background: #e24a4a; }

    .popover[hidden], .window[hidden], .wizard[hidden], .stagebar[hidden] { display: none !important; }

    .popover {
      position: absolute;
      top: 30px;
      right: 78px;
      width: 276px;
      background: rgba(246,246,246,.93);
      border: 1px solid rgba(0,0,0,.1);
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
      overflow: hidden;
      z-index: 30;
    }
    .pop-head { padding: 11px 14px 8px; }
    .pop-head h1 { font-size: 13px; font-weight: 600; }
    .pop-head .sub { font-size: 11px; color: #6e6e73; margin-top: 2px; line-height: 1.4; }
    .rows {
      margin: 0 8px 8px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.04);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid #ececed;
      font-size: 13px;
    }
    .row:last-child { border-bottom: 0; }
    .row .left { display: flex; align-items: center; gap: 8px; }
    .row .name { font-weight: 500; }
    .row .v { font-size: 12px; color: #6e6e73; }
    .row .v.err { color: #c32828; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #d0d0d4;
      flex: none;
    }
    .dot.ok { background: #1c1c1e; }
    .dot.warn { background: #b0b0b4; }
    .dot.err { background: #e24a4a; }
    .pop-foot {
      border-top: 1px solid rgba(0,0,0,.06);
      padding: 6px 8px 8px;
      display: flex;
      gap: 2px;
    }
    .link {
      flex: 1;
      text-align: center;
      font-size: 12px;
      padding: 5px 0;
      border-radius: 6px;
      color: #1c1c1e;
    }
    .link:hover { background: rgba(0,0,0,.06); }

    .traffic {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 6px;
    }
    .traffic i { width: 11px; height: 11px; border-radius: 50%; display: block; }
    .traffic .r { background: #ff5f57; }
    .traffic .y { background: #febc2e; }
    .traffic .g { background: #28c840; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 11px;
      border-radius: 5px;
      font-size: 13px;
      background: #fff;
      border: 1px solid #c4c4c6;
      box-shadow: 0 0.5px 0 rgba(0,0,0,.06);
    }
    .btn.primary {
      background: #0b6bdb;
      border-color: #0b6bdb;
      color: #fff;
      box-shadow: none;
    }
    .btn.danger {
      background: #d32525;
      border-color: #d32525;
      color: #fff;
      box-shadow: none;
    }
    .btn.ghost {
      background: none;
      border-color: transparent;
      box-shadow: none;
      color: #0b6bdb;
      padding: 0 6px;
    }

    /* Wizard */
    .wizard {
      position: absolute;
      left: 390px;
      top: 126px;
      width: 500px;
      height: 500px;
      background: #f3f3f3;
      border-radius: 10px;
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
      border: 1px solid rgba(0,0,0,.14);
      overflow: hidden;
      z-index: 15;
      display: flex;
      flex-direction: column;
    }
    .chrome {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #ececec;
      border-bottom: 1px solid rgba(0,0,0,.07);
      font-size: 13px;
      font-weight: 600;
      flex: none;
    }
    .wiz-body {
      flex: 1;
      padding: 22px 28px 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .step-index { font-size: 11px; color: #6e6e73; margin-bottom: 8px; }
    .wiz-body h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .lead { font-size: 13px; line-height: 1.55; color: #3a3a3c; margin-bottom: 16px; }
    .plain { list-style: none; margin: 0 0 18px; }
    .plain li {
      font-size: 13px;
      padding: 7px 0;
      border-bottom: 1px solid #e3e3e5;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .plain li:last-child { border-bottom: 0; }
    .plain .n { color: #8e8e93; width: 1.2em; flex: none; }
    .plain .t { flex: 1; }
    .plain .v { color: #6e6e73; }
    .box {
      background: #fff;
      border: 1px solid #e4e4e6;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .box .hd {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .box .hd .v { font-weight: 500; color: #6e6e73; }
    .box p, .note { font-size: 12px; color: #6e6e73; line-height: 1.5; }
    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0 0;
      margin-top: 8px;
      border-top: 1px solid #eee;
      font-size: 13px;
    }
    .field input {
      width: 120px;
      height: 22px;
      border: 1px solid #c9c9cc;
      background: #fff;
      border-radius: 5px;
      padding: 0 7px;
      font: inherit;
      font-size: 13px;
      text-align: right;
    }
    .checkrow {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .checkrow input { margin-top: 3px; }
    .checkrow .hint { display: block; font-size: 12px; color: #6e6e73; margin-top: 2px; }
    .wiz-foot {
      margin-top: auto;
      padding-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wiz-foot .right { display: flex; gap: 8px; }

    /* Settings */
    .window {
      position: absolute;
      left: 40px;
      top: 62px;
      width: 720px;
      height: 596px;
      background: #f0f0f0;
      border-radius: 10px;
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
      border: 1px solid rgba(0,0,0,.14);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 14;
    }
    .win-main { display: flex; flex: 1; min-height: 0; }
    .sidebar {
      width: 168px;
      flex: none;
      padding: 8px 8px 12px;
      border-right: 1px solid #e0e0e2;
      background: #ececec;
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 13px;
      text-align: left;
      margin-bottom: 1px;
      color: #1c1c1e;
    }
    .nav-item.active { background: #d6d6d8; }
    .nav-item:not(.active):hover { background: rgba(0,0,0,.05); }
    .nav-item svg { width: 15px; height: 15px; flex: none; opacity: .82; }
    .pane {
      flex: 1;
      overflow: auto;
      padding: 20px 24px 24px;
      background: #f6f6f6;
    }
    .pane[hidden] { display: none !important; }
    .pane h2 { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
    .pane-lead { font-size: 13px; line-height: 1.5; color: #3a3a3c; margin: -6px 0 12px; }
    .caption { font-size: 11px; color: #6e6e73; margin: 14px 1px 6px; }
    .caption:first-child { margin-top: 0; }
    .group {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e6e6e8;
    }
    .grow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      min-height: 36px;
    }
    .grow:last-child { border-bottom: 0; }
    .grow .help { display: block; font-size: 11px; color: #8e8e93; margin-top: 1px; line-height: 1.4; }
    .grow .v { color: #6e6e73; text-align: right; }
    .grow .v.err { color: #c32828; }
    .switch {
      width: 32px; height: 18px; border-radius: 9px;
      background: #34c759; position: relative; flex: none;
    }
    .switch::after {
      content: "";
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff;
      position: absolute; top: 2px; right: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
    }
    .switch.off { background: #ccc; }
    .switch.off::after { right: auto; left: 2px; }
    .alert {
      background: #fff;
      border: 1px solid #e6e6e8;
      border-left: 3px solid #c32828;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .alert strong { font-weight: 600; display: block; margin-bottom: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .debug-log {
      background: #1c1c1e;
      color: #e8e8ea;
      border-radius: 6px;
      padding: 10px 12px;
      font: 11px/1.55 "SF Mono", "Menlo", "Noto Sans Mono CJK SC", monospace;
      height: 240px;
      overflow: hidden;
    }
    .footer-note { font-size: 12px; color: #6e6e73; line-height: 1.5; margin-top: 10px; }
    .mono { font-family: "SF Mono", "Menlo", "Noto Sans Mono CJK SC", monospace; font-size: 12px; }

    .stagebar {
      position: absolute;
      left: 16px; right: 16px; bottom: 10px;
      height: 34px;
      background: rgba(20,20,22,.45);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px;
      z-index: 40;
      color: #eee;
    }
    .stagebar .lab { font-size: 11px; color: rgba(255,255,255,.6); padding: 0 8px; flex: none; }
    .stagebar button {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 5px;
      color: rgba(255,255,255,.86);
      white-space: nowrap;
    }
    .stagebar button.on { background: rgba(255,255,255,.16); color: #fff; }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="menubar">
      <div class="mb-left">
        <span class="apple" aria-hidden="true"><svg width="12" height="14" viewBox="0 0 12 14" fill="#1c1c1e"><path d="M8.7 3.6c-.5.3-1.2.3-1.7 0 .5-.3.8-.8.8-1.3 0-.2 0-.3.1-.5.5.1 1 .4 1.3.8.3.5.3 1-.5 1zm.8 1c1.2.1 2.1 1.2 2.1 2.6 0 1.9-1.1 3.9-2.3 3.9-.5 0-.8-.3-1.4-.3s-.9.3-1.4.3C5.3 11.1 4 9.7 4 7.6c0-1.5 1-2.6 2.1-2.6.6 0 1 .3 1.4.3s.8-.4 1.4-.4c.2 0 .4 0 .6.1z"/></svg></span>
        <span class="mb-item bold">Finder</span>
        <span class="mb-item">文件</span>
        <span class="mb-item">编辑</span>
        <span class="mb-item">显示</span>
        <span class="mb-item">前往</span>
        <span class="mb-item">窗口</span>
        <span class="mb-item">帮助</span>
      </div>
      <div class="mb-right">
        <span class="our" id="menubarStatus"><i class="pip warn" id="menubarPip"></i><span id="menubarText">设置中</span></span>
        <span class="mb-item">12:13</span>
      </div>
    </div>

    <section class="wizard" id="wizard">
      <div class="chrome">
        <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <span id="wizTitle">开始设置</span>
      </div>
      <div class="wiz-body" id="wizBody"></div>
    </section>

    <section class="window" id="settings" hidden>
      <div class="chrome">
        <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        设置
      </div>
      <div class="win-main">
        <nav class="sidebar" id="sidebar"></nav>
        <div id="paneHost" style="flex:1;min-width:0;display:flex;flex-direction:column;"></div>
      </div>
    </section>

    <aside class="popover" id="popover" hidden>
      <div class="pop-head">
        <h1>连接状态</h1>
        <div class="sub">速度看 Agent Speed，对话在 Codex 里处理</div>
      </div>
      <div class="rows" id="popRows"></div>
      <div class="pop-foot">
        <button class="link" type="button" data-open-tab="general">设置</button>
        <button class="link" type="button" data-open-tab="debug">调试</button>
      </div>
    </aside>

    <nav class="stagebar" id="stagebar">
      <span class="lab">用户旅程</span>
    </nav>
  </div>

<script>
const STAGES = [
  { id: "welcome", label: "第一次打开" },
  { id: "speed", label: "Agent Speed" },
  { id: "hook", label: "安装 Hook" },
  { id: "eink", label: "墨水屏" },
  { id: "done", label: "完成" },
  { id: "daily", label: "日常设置" },
  { id: "broken", label: "Hook 失效" },
  { id: "cleanup", label: "清理" }
];
const ICON = {
  general: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.8 1.6h2.4l.3 1.5c.4.1.7.3 1.1.6l1.4-.5 1.2 2.1-1.2.9c.1.3.1.7.1 1 0 .4 0 .7-.1 1l1.2.9-1.2 2.1-1.4-.5c-.4.3-.7.5-1.1.6l-.3 1.5H6.8l-.3-1.5c-.4-.1-.7-.3-1.1-.6l-1.4.5-1.2-2.1 1.2-.9a4 4 0 0 1 0-2l-1.2-.9 1.2-2.1 1.4.5c.4-.3.7-.5 1.1-.6l.3-1.5zM8 6.3a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4z"/></svg>',
  speed: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.7a6.3 6.3 0 1 0 4.5 10.7l.9.9 1-1-.9-.9A6.3 6.3 0 0 0 8 1.7zm0 1.3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm.1 1.6h1.1v2.7l1.9 1.3-.6.9L8.1 7.5z"/></svg>',
  hook: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.4 2.4h9.2v11.2H3.4zm1.3 1.3v8.6h6.6V3.7zM5.6 5.1h4.6v1.1H5.6zm0 2.2h4.6v1.1H5.6zm0 2.2h2.8v1.1H5.6z"/></svg>',
  eink: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.3 3.2h11.4v8.4H2.3zm1.3 1.3v5.8h8.8V4.5zM6.2 12.4h3.6v1.1H6.2z"/></svg>',
  debug: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M10.4 2.3 12 3.9l-1.2 1.2 1.1 1.1 1.2-1.2 1.6 1.6-1.2 1.2-1.5-1.5-5.7 5.7-2.4-.1-.1-2.4 5.7-5.7-1.5-1.5 1.2-1.2 1.6 1.6 1.2-1.2z"/></svg>',
  cleanup: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.1 2.2h3.8l.5 1.3h2.8v1.2H2.8V3.5h2.8zm-.4 3.7h4.6v7.4c0 .4-.3.7-.7.7H6.4c-.4 0-.7-.3-.7-.7z"/></svg>',
  about: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.6a6.4 6.4 0 1 0 0 12.8A6.4 6.4 0 0 0 8 1.6zm0 1.3a5.1 5.1 0 1 1 0 10.2 5.1 5.1 0 0 1 0-10.2zM7.4 4.5h1.2v1.4H7.4zm0 2.5h1.2v4.6H7.4z"/></svg>'
};
const TABS = [
  { id: "general", name: "一般" },
  { id: "speed", name: "Agent Speed" },
  { id: "hook", name: "Codex" },
  { id: "eink", name: "墨水屏" },
  { id: "debug", name: "调试" },
  { id: "cleanup", name: "清理" },
  { id: "about", name: "关于" }
];

const params = new URLSearchParams(location.search);
const shot = params.get("shot") === "1";
let stage = params.get("stage") || "welcome";
let tab = params.get("tab") || "general";
const state = {
  loginItem: true,
  speed: false,
  hook: false,
  hookBroken: false,
  eink: false,
  hookRemoved: false
};

function applyStageDefaults(id) {
  state.hookBroken = false;
  state.hookRemoved = false;
  if (id === "welcome" || id === "speed") {
    state.speed = false; state.hook = false; state.eink = false;
  } else if (id === "hook") {
    state.speed = true; state.hook = false; state.eink = false;
  } else if (id === "eink" || id === "done" || id === "daily" || id === "cleanup") {
    state.speed = true; state.hook = true; state.eink = false;
  } else if (id === "broken") {
    state.speed = true; state.hook = true; state.hookBroken = true; state.eink = false;
  }
}
applyStageDefaults(stage);

function menubarCopy() {
  if (["welcome","speed","hook","eink","done"].includes(stage)) return { text: "设置中", cls: "warn" };
  if (state.hookBroken) return { text: "Hook 失效", cls: "err" };
  if (state.speed && state.hook && !state.hookRemoved && state.eink) return { text: "已连接", cls: "ok" };
  return { text: "未连接", cls: "warn" };
}

function rowStatus() {
  const speed = state.speed ? { v: "已连接", cls: "ok" } : { v: "未连接", cls: "warn" };
  let hook;
  if (state.hookRemoved) hook = { v: "已移除", cls: "" };
  else if (state.hookBroken) hook = { v: "已失效", cls: "err", err: true };
  else if (state.hook) hook = { v: "已安装", cls: "ok" };
  else hook = { v: "未安装", cls: "warn" };
  const eink = state.eink ? { v: "已连接", cls: "ok" } : { v: "未连接", cls: "warn" };
  return { speed, hook, eink };
}

function renderMenubar() {
  const m = menubarCopy();
  document.getElementById("menubarText").textContent = m.text;
  document.getElementById("menubarPip").className = "pip " + m.cls;
}

function renderPopover() {
  const show = ["daily","broken","cleanup"].includes(stage);
  document.getElementById("popover").hidden = !show;
  const s = rowStatus();
  document.getElementById("popRows").innerHTML = `
    <div class="row"><div class="left"><i class="dot ${s.eink.cls}"></i><span class="name">墨水屏</span></div><span class="v">${s.eink.v}</span></div>
    <div class="row"><div class="left"><i class="dot ${s.speed.cls}"></i><span class="name">Agent Speed</span></div><span class="v">${s.speed.v}</span></div>
    <div class="row"><div class="left"><i class="dot ${s.hook.cls}"></i><span class="name">Codex hook</span></div><span class="v${s.hook.err ? " err" : ""}">${s.hook.v}</span></div>`;
}

function stepIndex(n) { return `<div class="step-index">${n} / 3</div>`; }

function wizWelcome() {
  return `
    <div class="step-index">第一次打开</div>
    <h2>开始设置</h2>
    <p class="lead">这个客户端只显示连接状态。先接上 Agent Speed，再给 Codex 安装 hook。墨水屏可以稍后再连。速度仍在 Agent Speed 里看，对话仍在 Codex 里处理。</p>
    <ol class="plain">
      <li><span class="n">1</span><span class="t">连接 Agent Speed</span></li>
      <li><span class="n">2</span><span class="t">安装 Codex hook</span></li>
      <li><span class="n">3</span><span class="t">连接墨水屏，可稍后</span></li>
    </ol>
    <label class="checkrow">
      <input type="checkbox" checked disabled>
      <span>开机时启动<span class="hint">建议打开。系统可能会再确认一次。</span></span>
    </label>
    <div class="wiz-foot"><span></span><div class="right"><button class="btn primary" type="button" data-stage="speed">继续</button></div></div>`;
}

function wizSpeed() {
  const ok = state.speed;
  return `
    ${stepIndex(1)}
    <h2>连接 Agent Speed</h2>
    <p class="lead">${ok ? "已经连上，速度数据可以从这里转给墨水屏。" : "检测到 Agent Speed 在运行，但局域网还没打开，默认是关的。打开后点重新检测。"}</p>
    <div class="box">
      <div class="hd">Agent Speed <span class="v">${ok ? "已连接" : "未连接"}</span></div>
      <p>${ok ? "端口 7247，访问码已保存。" : "在 Agent Speed 里打开局域网。默认端口 7247，如有访问码，填在下面。"}</p>
      <div class="field"><span>端口</span><input value="7247" readonly></div>
      <div class="field"><span>访问码</span><input value="${ok ? "已保存" : ""}" placeholder="可选" readonly></div>
    </div>
    <div class="wiz-foot">
      <button class="btn ghost" type="button" data-stage="welcome">上一步</button>
      <div class="right">
        <button class="btn" type="button" data-skip-speed>跳过</button>
        ${ok
          ? `<button class="btn primary" type="button" data-stage="hook">继续</button>`
          : `<button class="btn primary" type="button" data-connect-speed>重新检测</button>`}
      </div>
    </div>`;
}

function wizHook() {
  const ok = state.hook;
  return `
    ${stepIndex(2)}
    <h2>安装 Codex hook</h2>
    <p class="lead">Codex 在需要你批准、或一轮结束时，会调用一个小脚本。脚本只通知「有事要看」，不会传送对话正文。</p>
    <div class="box">
      <div class="hd">Codex hook <span class="v">${ok ? "已安装" : "未安装"}</span></div>
      <p>已检测到本机有 Codex。安装时会把脚本放到本应用的数据目录，并写入用户目录下的 <span class="mono">.codex/hooks.json</span>，只追加我们的条目。</p>
    </div>
    ${ok ? `<p class="note">以后如果失效，到设置里的 Codex 一页重新安装。不用了也在同一页移除。</p>` : ""}
    <div class="wiz-foot">
      <button class="btn ghost" type="button" data-stage="speed">上一步</button>
      <div class="right">
        <button class="btn" type="button" data-skip-hook>跳过</button>
        ${ok
          ? `<button class="btn primary" type="button" data-stage="eink">继续</button>`
          : `<button class="btn primary" type="button" data-install-hook>安装 hook</button>`}
      </div>
    </div>`;
}

function wizEink() {
  return `
    ${stepIndex(3)}
    <h2>连接墨水屏</h2>
    <p class="lead">设备还连不上的话，可以先跳过。跳过后这一项是「未连接」，等能连了再来设置里接上。</p>
    <div class="box">
      <div class="hd">墨水屏 <span class="v">未连接</span></div>
      <p>之后可用 Wi-Fi 地址连接，或在插着 USB 时选取设备。这台 Mac 上可能有不止一个 ESP32 串口，请确认是这块屏。</p>
    </div>
    <div class="wiz-foot">
      <button class="btn ghost" type="button" data-stage="hook">上一步</button>
      <div class="right">
        <button class="btn" type="button" data-stage="done">稍后在设置里连接</button>
        <button class="btn primary" type="button" data-stage="done">跳过</button>
      </div>
    </div>`;
}

function wizDone() {
  return `
    <div class="step-index">设置完成</div>
    <h2>之后看菜单栏就行</h2>
    <p class="lead">点开能看到三项各自的状态。设置、调试和清理都在同一个窗口里。</p>
    <ol class="plain">
      <li><span class="t">开机启动</span><span class="v">开</span></li>
      <li><span class="t">Agent Speed</span><span class="v">${state.speed ? "已连接" : "未连接"}</span></li>
      <li><span class="t">Codex hook</span><span class="v">${state.hook ? "已安装" : "未安装"}</span></li>
      <li><span class="t">墨水屏</span><span class="v">未连接</span></li>
    </ol>
    <div class="wiz-foot">
      <button class="btn ghost" type="button" data-stage="eink">上一步</button>
      <div class="right"><button class="btn primary" type="button" data-stage="daily">完成</button></div>
    </div>`;
}

function renderWizard() {
  const wiz = document.getElementById("wizard");
  const isWiz = ["welcome","speed","hook","eink","done"].includes(stage);
  wiz.hidden = !isWiz;
  if (!isWiz) return;
  document.getElementById("wizTitle").textContent = "开始设置";
  document.getElementById("wizBody").innerHTML = {
    welcome: wizWelcome, speed: wizSpeed, hook: wizHook, eink: wizEink, done: wizDone
  }[stage]();
}

function paneGeneral() {
  return `
    <h2>一般</h2>
    <div class="caption">启动</div>
    <div class="group">
      <div class="grow">
        <div>开机启动<span class="help">打开时，系统可能会再确认一次</span></div>
        <span class="switch${state.loginItem?"":" off"}"></span>
      </div>
      <div class="grow">
        <div>再走一遍设置向导<span class="help">第一次安装的步骤可以随时重来</span></div>
        <button class="btn" type="button" data-stage="welcome">打开向导</button>
      </div>
    </div>
    <div class="caption">菜单栏</div>
    <div class="group">
      <div class="grow"><span>显示内容</span><span class="v">仅连接状态</span></div>
    </div>
    <p class="footer-note">速度看 Agent Speed，对话在 Codex 里处理，不在菜单栏重复显示。</p>`;
}

function paneSpeed() {
  return `
    <h2>Agent Speed</h2>
    <p class="pane-lead">从它的局域网接口读速度。接口默认是关的，需要在 Agent Speed 里打开。</p>
    <div class="group">
      <div class="grow"><span>状态</span><span class="v">${state.speed ? "已连接" : "未连接"}</span></div>
      <div class="grow"><span>端口</span><span class="v">7247</span></div>
      <div class="grow"><span>访问码</span><span class="v">${state.speed ? "已保存" : "未填写"}</span></div>
    </div>
    <div class="actions">
      <button class="btn" type="button">测试连接</button>
      <button class="btn" type="button">更改访问码</button>
    </div>
    <p class="footer-note">未连接时，先确认 Agent Speed 已打开局域网，端口一致，访问码没有改过。</p>`;
}

function paneHook() {
  if (state.hookBroken) {
    return `
      <h2>Codex</h2>
      <div class="alert">
        <strong>Hook 已失效</strong>
        找不到我们登记的条目，或脚本已经不在原位置。常见原因是用户目录下的 <span class="mono">.codex/hooks.json</span> 被改写，或数据目录里的脚本被移走。
      </div>
      <div class="group">
        <div class="grow"><span>Codex</span><span class="v">已检测到</span></div>
        <div class="grow"><span>Hook 状态</span><span class="v err">已失效</span></div>
        <div class="grow"><span>登记位置</span><span class="v mono">.codex/hooks.json</span></div>
        <div class="grow"><span>事件</span><span class="v">PermissionRequest · Stop</span></div>
      </div>
      <div class="actions">
        <button class="btn primary" type="button" data-reinstall-hook>重新安装 hook</button>
        <button class="btn" type="button">打开 hooks.json</button>
      </div>
      <p class="footer-note">重新安装只会写回我们自己的脚本和条目，不会覆盖你的其他 hook。</p>`;
  }
  if (state.hookRemoved || !state.hook) {
    return `
      <h2>Codex</h2>
      <p class="pane-lead">还没有安装 hook。装上之后，Codex 需要你批准或一轮结束时，会通知这个客户端。不会传送对话正文。</p>
      <div class="group">
        <div class="grow"><span>Codex</span><span class="v">已检测到</span></div>
        <div class="grow"><span>Hook 状态</span><span class="v">${state.hookRemoved ? "已移除" : "未安装"}</span></div>
        <div class="grow"><span>将登记到</span><span class="v mono">.codex/hooks.json</span></div>
        <div class="grow"><span>事件</span><span class="v">PermissionRequest · Stop</span></div>
      </div>
      <div class="actions">
        <button class="btn primary" type="button" data-reinstall-hook>安装 hook</button>
      </div>`;
  }
  return `
    <h2>Codex</h2>
    <p class="pane-lead">Hook 已安装。它只通知「有事要看」，不会把对话正文送到墨水屏。</p>
    <div class="group">
      <div class="grow"><span>Codex</span><span class="v">已检测到</span></div>
      <div class="grow"><span>Hook 状态</span><span class="v">已安装</span></div>
      <div class="grow"><span>登记位置</span><span class="v mono">.codex/hooks.json</span></div>
      <div class="grow"><span>事件</span><span class="v">PermissionRequest · Stop</span></div>
    </div>
    <div class="caption">维护</div>
    <div class="group">
      <div class="grow">
        <div>重新安装<span class="help">配置被改写或脚本丢失时用这个修</span></div>
        <button class="btn" type="button" data-reinstall-hook>重新安装</button>
      </div>
      <div class="grow">
        <div>测试通知<span class="help">先在本机走一遍，不必等 Codex 真的来一次</span></div>
        <button class="btn" type="button">发送测试</button>
      </div>
      <div class="grow">
        <div>移除 hook<span class="help">只删除我们写入的条目和脚本</span></div>
        <button class="btn" type="button" data-remove-hook>移除</button>
      </div>
    </div>`;
}

function paneEink() {
  return `
    <h2>墨水屏</h2>
    <p class="pane-lead">设备能连上再接。还连不上就保持未连接即可。</p>
    <div class="group">
      <div class="grow"><span>状态</span><span class="v">${state.eink ? "已连接" : "未连接"}</span></div>
      <div class="grow"><span>地址</span><span class="v">未设置</span></div>
      <div class="grow"><span>刷新</span><span class="v">速度节流 · 通知立即推</span></div>
    </div>
    <div class="actions">
      <button class="btn" type="button">扫描 Wi-Fi 设备</button>
      <button class="btn" type="button">选取 USB 设备</button>
    </div>
    <p class="footer-note">用 USB 时请确认串口是这块屏。这台 Mac 上可能同时有不止一个 ESP32 设备。</p>`;
}

function paneDebug() {
  const lines = [
    "12:13:04  客户端已启动",
    state.speed ? "12:13:05  Agent Speed 已连接  :7247" : "12:13:05  Agent Speed 未连接",
    state.hookBroken ? "12:13:05  Codex hook 已失效：找不到登记项" :
      state.hook && !state.hookRemoved ? "12:13:05  Codex hook 已安装" : "12:13:05  Codex hook 未安装",
    "12:13:05  墨水屏未连接（当前为浏览器预览）"
  ];
  return `
    <h2>调试</h2>
    <div class="debug-log">${lines.join("<br>")}</div>
    <div class="actions">
      <button class="btn" type="button">注入「等待批准」</button>
      <button class="btn" type="button">注入「本轮结束」</button>
      <button class="btn" type="button">重试全部连接</button>
      <button class="btn" type="button">查看最近一帧</button>
    </div>
    <p class="footer-note">注入事件只用来预览，不会改 Codex 里的真实对话。</p>`;
}

function paneCleanup() {
  return `
    <h2>清理</h2>
    <p class="pane-lead">不用了，或准备卸载时，先在这里收拾干净。卸掉应用前如果不移除 hook，Codex 仍可能调用已经不存在的脚本。</p>
    <div class="group">
      <div class="grow">
        <div>移除 Codex hook<span class="help">只删除我们写入的条目和脚本</span></div>
        <button class="btn" type="button" data-remove-hook>${state.hookRemoved || !state.hook ? "已移除" : "移除"}</button>
      </div>
      <div class="grow">
        <div>清除已保存的连接信息<span class="help">访问码、设备地址</span></div>
        <button class="btn" type="button">清除</button>
      </div>
      <div class="grow">
        <div>关闭开机启动</div>
        <span class="switch${state.loginItem?"":" off"}"></span>
      </div>
    </div>
    <div class="caption">卸载应用</div>
    <div class="group">
      <div class="grow">
        <div>退出并移到废纸篓<span class="help">先完成上面的 hook 清理，再删除应用</span></div>
        <button class="btn danger" type="button">退出</button>
      </div>
    </div>`;
}

function paneAbout() {
  return `
    <h2>关于</h2>
    <div class="group">
      <div class="grow"><span>这个客户端</span><span class="v">只显示连接状态</span></div>
      <div class="grow"><span>版本</span><span class="v">预览</span></div>
    </div>
    <p class="footer-note">速度看 Agent Speed，对话在 Codex 里处理。墨水屏用来在主显示器之外瞥一眼是否有事要处理。</p>`;
}

const PANES = {
  general: paneGeneral, speed: paneSpeed, hook: paneHook,
  eink: paneEink, debug: paneDebug, cleanup: paneCleanup, about: paneAbout
};

function renderSettings() {
  const show = ["daily","broken","cleanup"].includes(stage);
  document.getElementById("settings").hidden = !show;
  if (!show) return;
  if (stage === "broken") tab = "hook";
  if (stage === "cleanup") tab = "cleanup";
  document.getElementById("sidebar").innerHTML = TABS.map(t => `
    <button class="nav-item${t.id===tab?" active":""}" type="button" data-tab="${t.id}">
      ${ICON[t.id]}<span>${t.name}</span>
    </button>`).join("");
  document.getElementById("paneHost").innerHTML = `<div class="pane">${PANES[tab]()}</div>`;
}

function renderStagebar() {
  const bar = document.getElementById("stagebar");
  bar.hidden = shot;
  bar.innerHTML = `<span class="lab">用户旅程</span>` + STAGES.map(s =>
    `<button type="button" class="${s.id===stage?"on":""}" data-stage="${s.id}">${s.label}</button>`
  ).join("");
}

function goStage(id, opts={}) {
  stage = id;
  if (!opts.keepState) applyStageDefaults(id);
  if (id === "daily") tab = opts.tab || "general";
  if (id === "broken") tab = "hook";
  if (id === "cleanup") tab = "cleanup";
  render();
}

function render() {
  renderMenubar();
  renderWizard();
  renderSettings();
  renderPopover();
  renderStagebar();
}

document.querySelector(".desktop").addEventListener("click", (e) => {
  const t = e.target.closest("[data-stage],[data-tab],[data-connect-speed],[data-skip-speed],[data-install-hook],[data-skip-hook],[data-reinstall-hook],[data-remove-hook],[data-open-tab]");
  if (!t) return;
  if (t.dataset.stage) {
    const fromBar = t.closest("#stagebar");
    goStage(t.dataset.stage, { keepState: !fromBar && !["broken","cleanup"].includes(t.dataset.stage) });
    return;
  }
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.dataset.openTab) { tab = t.dataset.openTab; stage = "daily"; render(); return; }
  if ("connectSpeed" in t.dataset) { state.speed = true; render(); return; }
  if ("skipSpeed" in t.dataset) { state.speed = false; goStage("hook", { keepState: true }); return; }
  if ("installHook" in t.dataset) { state.hook = true; render(); return; }
  if ("skipHook" in t.dataset) { state.hook = false; goStage("eink", { keepState: true }); return; }
  if ("reinstallHook" in t.dataset) { state.hook = true; state.hookBroken = false; state.hookRemoved = false; render(); return; }
  if ("removeHook" in t.dataset) { state.hook = false; state.hookRemoved = true; state.hookBroken = false; render(); return; }
});

render();
</script>
</body>
</html>
